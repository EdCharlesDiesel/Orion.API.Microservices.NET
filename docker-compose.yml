version: '3.8'

services:
  
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: $ta99Ath0
      POSTGRES_DB: healthdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  orion.external.paymentgateway:
    image: orion.external.paymentgateway
    build:
      context: .
      dockerfile: src/ApiGateways/External.PaymentGateway/Dockerfile

  orion.ocelotapigw:
