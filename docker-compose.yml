version: '3.4'

services:
  orion.services.stockanalyzer.api:
    image: ${DOCKER_REGISTRY-}orionservicesstockanalyzerapi
    build:
      context: .
      dockerfile: src/Services/StockAnalyzer/StockAnalyzer.API/Dockerfile

  orion.webapps.healthcheck:
    image: ${DOCKER_REGISTRY-}orionwebappshealthcheck
    build:
      context: .
      dockerfile: src/WebApps/WebStatus/Dockerfile

  users:
    image: users
    build:
      context: .
      dockerfile: src/Services/Users/Dockerfile

  orion.webapps.healthcheck-1:
    image: orion.webapps.healthcheck-1
    build:
      context: .
      dockerfile: src/WebApps/Orion.WebApps.HealthCheck/Dockerfile

  orion.web:
    image: orion.web
    build:
      context: .
      dockerfile: Orion.Web/Dockerfile

